const skMod=id=>(sk(id)>=SK_MAX&&S.player.skMod&&S.player.skMod[id])||null;
const hasMod=(id,c)=>skMod(id)===c;
function chooseMod(id,c){ const P=S.player; if(S.mode!=='town'||!SKILL_MODS[id]||!SKILL_MODS[id][c]||sk(id)<SK_MAX||skMod(id)) return false; vitals(()=>{ P.skMod=P.skMod||{}; P.skMod[id]=c; }); return true; }
const siphonCost=()=>hasMod('soulwell','b')?6:8;   // Soul Siphon: see the SOULS block for its armor piercing and Souls

// ===== MINION COMMANDS =====
// Once per room, each kind of minion in your army can be given an order. Orders are free: they do not use your turn.
const CMDS={
  vanguard:{name:'Taunt',      desc:'For 2 turns, foes aim their attacks at your vanguards, and a vanguard takes any Sundering Blow (other boss moves still land where they land).'},
  striker: {name:'Focus',      desc:'This turn your strikers always crit, and a focused crit breaks a boss\'s charging move.'},
  mender:  {name:'Bone Shield',desc:'Each mender wards you for 150% of its attack.'},
  reaper:  {name:'Execute',    desc:'This turn your reapers deal double damage to foes below 40% HP.'}
};
const canCommand=role=>S.mode==='battle'&&!!CMDS[role]&&!(S.run.cmd&&S.run.cmd[role])&&S.army.some(m=>m.role===role&&m.hp>0);
function command(role){
  if(!canCommand(role)) return false;
  const r=S.run, P=S.player, mine=S.army.filter(m=>m.role===role&&m.hp>0); r.cmd=r.cmd||{}; r.cmd[role]=true; tally('commands');
  if(role==='vanguard'){ r.taunt=2; log('Taunt: your vanguards bellow, and every foe turns on them.','ok'); }
  else if(role==='striker'){ r.focus=true; log('Focus: your strikers pick their spots.','ok'); }
  else if(role==='mender'){ const w=mine.reduce((a,m)=>a+Math.round(m.atk*1.5),0); P.shield=Math.min(Math.round(pMax()*.6),P.shield+w); mark('p',0,0); log('Bone Shield: your menders ward you. You hold '+P.shield+' ward.','ok'); }
  else { r.execute=true; log('Execute: your reapers look for the weak.','ok'); }
  sfx('skill'); return true;
}

// ===== STORY AND BOSS VOICES =====
// The Ledger tells its story as you go: a passage for the first clear of each gate and for Tower milestones. Bosses speak.
const STORY=[
  {act:1,id:'intro',t:'The Ledger opens',m:'You found the book in a drowned chapel, its pages blank but warm. When you wrote your name inside, every grave in the valley turned over in its sleep. The Ledger wants names. It will give you the dead who answer to them.'},
  {act:1,id:'g0',t:'The Rat King',m:'The Rat King was a tanner once, buried under his own vats. He held his court of vermin for forty years, waiting for someone to tell him he could stop. The Ledger wrote his name in a careful hand, and somewhere beneath the city a second page filled itself in.'},
  {act:1,id:'g1',t:'The Crypt Warden',m:'The Warden kept his post long after the family he guarded had rotted. He did not fight you for treasure. He fought because no one had ever relieved him of his watch. In the Ledger his entry ends with a single word: dismissed.'},
  {act:2,id:'g2',t:'The Ember Knight',m:'The barrow burned because the Knight would not let it go out. He believed the fire kept something worse asleep beneath the mound. The Ledger does not say whether he was right. The ground is still warm.'},
  {act:2,id:'g3',t:'The Bishop of Teeth',m:'The Bishop preached that the dead should keep their voices. His choir sang for a century without breath. When he fell, the Ledger turned to a page already written, in your handwriting, that you do not remember writing.'},
  {act:2,id:'g4',t:'The Orchard Mother',m:'The Mother planted iron in the ground and grew a forest of it, to fence in her children. You learn too late that her children were the graves of the valley, and that the Ledger had been eating them one name at a time.'},
  {act:2,id:'g5',t:'The Pale Sovereign',m:'The Sovereign was the last to hold the Ledger before you. He wrote until there were no names left but his own, and then he wrote that one too. His court kneels to you now. The book has a new final page, and it is blank, and it is waiting.'},
  {act:3,id:'t25',t:'The burning stair',m:'Twenty-five floors into the Tower, the walls begin to whisper names from the Ledger. Some of them are yours. The dead you raised did not come from nowhere; the Tower has been sending them up for a very long time.'},
  {act:3,id:'t50',t:'Halfway to the throne',m:'At the fiftieth floor you find a lectern of black iron, and on it a ledger like yours, open to a page of crossed-out names. Every name but one has a line through it. The last is the name of the Tower itself.'},
  {act:3,id:'t75',t:'The hollow choir',m:'The seraphs here were never holy. They were the Ledger\'s first keepers, burned for the names they would not give up. They sing your name as you climb, not in warning, but in welcome.'},
  {act:3,id:'t100',t:'The King of Hell',m:'Abaddon kept the other half of the book. When he falls, his pages fly to yours and stitch themselves in. The Ledger is whole for the first time in a thousand years, and every soul in it, above and below, now answers to you.'},
  {act:4,id:'ngp',t:'The book begins again',m:'You closed the Ledger and opened it again, and the first page was blank. Your titles remain, written in a margin no one else can read. The dead remember you. They will be harder to convince this time.'},
  // ---- Act I: the name
  {act:1,id:'raise1',t:'The first to answer',when:()=>T_('raised')>=1,m:'The first one stood up slowly, as if embarrassed to be seen. It did not ask who you were. It looked at the Ledger in your hand and waited, the way a dog waits for a word. Somewhere in the book, a line of ink you had not written dried.'},
  {act:1,id:'fall1',t:'The ground says no',when:()=>T_('deaths')>=1,m:'You fell, and for a moment the earth reached for you the way it reaches for everyone. Then it let go. You woke at the gate with the Ledger warm against your chest. It is not finished with you. You are not sure that is a kindness.'},
  {act:1,id:'lv5',t:'Ink under the nails',when:()=>S.player.lvl>=5,m:'Your fingers are stained black now, and the stain does not wash out. When you sleep, you hear pages turning. The townsfolk have started crossing the street when you pass, and the dogs have stopped barking at you altogether.'},
  {act:1,id:'evolve1',t:'They remember being people',when:()=>T_('evolved')>=1,m:'One of your dead grew into something more, and in the moment it changed it spoke a name. Not yours. Its own, from before. The Ledger wrote it down at once, as if afraid it would be forgotten again.'},
  // ---- Act II: the valley
  {act:2,id:'town',t:'A town that looks away',when:()=>townOpen()&&anyClear(),m:'The town lets you build at its edge, because it needs what you bring back and fears what follows you. The mayor will not shake your hand. He takes your gold with gloves on, and burns the gloves after, and thanks you every time.'},
  {act:2,id:'curse1',t:'The gate that hates you',when:()=>T_('cursed')>=1,m:'A cursed gate is not cursed at random. The Ledger has enemies among the dead it has not yet named, and they gather where you hunt, and they twist the stone against you. You won anyway. They will remember that too.'},
  {act:2,id:'oath_hon',t:'The Old Gods answer',when:()=>faithOf()==='hon',m:'You knelt at the cracked altar and the Old Gods, who had not been asked for anything in a long time, answered. They do not approve of the Ledger. But they would rather it were held by someone who still kneels.'},
  {act:2,id:'oath_dis',t:'A debt called in',when:()=>faithOf()==='dis',m:'You spat on the altar and nothing struck you down. That was the answer. The Old Gods are old, and tired, and they have watched the Ledger outlive every one of them. You take what is owed. They let you.'},
  {act:2,id:'army5',t:'A household of the dead',when:()=>S.army.length>=5,m:'Five of them now, following you through the market at dawn. They carry your bags. They stand in the rain without complaint. One of them hums a song from a village that burned a century ago, and the others, slowly, have learned the words.'},
  {act:2,id:'tower0',t:'The Tower notices',when:()=>S.player.lvl>=TW.unlock,m:'Far to the east a tower of red stone has stood for as long as the valley has had a name. Tonight a light came on in its lowest window. The Ledger turned, unbidden, to a page headed with a single word: Climb.'},
  {act:2,id:'hard1',t:'Asking for more',when:()=>T_('heat1')>0,m:'You went back into a gate you had already emptied and asked it for something harder. The dead there were insulted, and rose stronger to prove it. The Ledger likes this about you. It writes faster when you are greedy.'},
  {act:2,id:'elder1',t:'An elder among the dead',when:()=>T_('elder')>=1,m:'One of yours has grown old in death, wiser than the living who buried it. It watches you write in the Ledger with an expression you cannot read. Once, when you hesitated over a name, it reached over and pointed.'},
  // ---- Act III: the climb
  {act:3,id:'t10',t:'The first warden',m:'The Gate Hound was not guarding the Tower from you. It was guarding the valley from the Tower. When it fell, it looked almost relieved, and the stair above it lit itself, step by step, all the way up into the dark.'},
  {act:3,id:'t40',t:'Flies and chains',m:'By the fortieth floor the Tower stops pretending to be a building. The walls breathe. The dukes of this place keep courts of their own, and each of them once held a page torn from the Ledger, and none of them gave it up willingly.'},
  {act:3,id:'t60',t:'The executioner\'s block',m:'The Pale Executioner kept a tally of everyone he had ended. You found it carved into the block: a long column of marks, and at the very bottom, freshly cut, a mark for you. You chiselled it out before you climbed on.'},
  {act:3,id:'t90',t:'The broken halo',m:'The Seraph fell without a sound, and its halo cracked in two. One half held the light of something holy. The other held a name written in the Ledger\'s hand. You could not tell which half was heavier.'},
  {act:3,id:'ult1',t:'Five souls in the hand',when:()=>S.player.lvl>=ULT_LV,m:'You learned to hold souls the way a miser holds coins, and to spend them all at once. The first time you did, the sky over the gate went dark for a heartbeat, and every bird in the valley fell silent until dawn.'},
  {act:3,id:'bless_hon',t:'Grace',when:()=>blessed('hon'),m:'Twenty-five dawns kept faithfully, and the Old Gods have put a hand on your shoulder. They will not let you fall in the gates. They say nothing about the Tower. Even gods have places they will not go.'},
  {act:3,id:'bless_dis',t:'The tithe',when:()=>blessed('dis'),m:'Twenty-five dawns of taking, and now the dead pay you before you ask. You enter every gate with souls already in your hand, warm and pleading. The Old Gods have stopped watching you. You find you prefer it.'},
  {act:3,id:'secret1',t:'Something older',when:()=>SECRET.some((B,i)=>T_('secret_'+i)>0),m:'There are names the Ledger never wanted you to find: masters older than the gates they hide beneath. You found one anyway, and wrote it down in red. The book was quiet for a full day afterwards, as if offended.'},
  {act:3,id:'nm1',t:'Nightmare',when:()=>DUNGEONS.some((D,i)=>T_('nm'+i)>0),m:'You walked through a gate on its worst night and walked back out. The dead who saw it have started telling the story to each other, in the dark between rooms. In their version, you are much taller.'},
  {act:3,id:'lv50',t:'Half a book of names',when:()=>S.player.lvl>=50,m:'You have written more names than the valley has living people. Some nights you take the Ledger out just to read them, the way other people read letters from home. You have started to forget which of them you knew in life.'},
  {act:3,id:'secret6',t:'All the old masters',when:()=>SECRET.every((B,i)=>T_('secret_'+i)>0),m:'Six masters older than the gates, and every one of them in red ink now. The Ledger has stopped arguing. On the page after the last of them, someone long ago wrote a single line: The one who finds us all is ready for the end of the book.'},
  // ---- Act IV: the abyss and the end of the book
  {act:4,id:'t110',t:'Below the bottom',when:()=>S.tower.best>=110,m:'Abaddon was not the bottom. Past his throne the Tower keeps going, down and up at once, into a place with no floors and no names. The Ledger\'s pages are blank here. It is waiting to see what you will write.'},
  {act:4,id:'t150',t:'The Abyss looks back',when:()=>S.tower.best>=150,m:'One hundred and fifty floors. The wardens here have no stories, no faces, no names at all; they are what is left when the Ledger has taken everything else. You wonder, briefly, whether that is what you are climbing toward.'},
  {act:4,id:'t200',t:'Where the ink runs out',when:()=>S.tower.best>=200,m:'At the two hundredth floor the ink in the Ledger thins to grey. The book is not running out of pages. It is running out of reasons. For the first time since the drowned chapel, it asks you a question: Why do you keep climbing?'},
  {act:4,id:'ngp2',t:'Twice told',when:()=>(S.ngp||0)>=2,m:'The second time through, the dead knew your face before you raised them. The Rat King called you by name. The Warden saluted. The book is beginning again, but it is not beginning from nothing anymore, and neither are you.'},
  {act:4,id:'ngp3',t:'The keeper who stays',when:()=>(S.ngp||0)>=3,m:'Three times you have closed the Ledger, and three times opened it. The Pale Sovereign wrote his own name to escape it. You have not. Perhaps that is the difference between a prisoner and a keeper. Perhaps there is none.'},
  {act:4,id:'pages',t:'The last page',when:()=>(S.pages||0)>=LORE_PAGES.length,m:'Every torn page has found its way home, and the Ledger is whole in a way it never was. On the final page is the scribe\'s last instruction: whoever holds the book may close it forever by writing their own name. Your pen hovers over the page. Not yet.'},
  {act:5,id:'cmd1',t:'One who leads',when:()=>T_('commanders')>=1||(S.army||[]).some(m=>hasTrait(m,'commander')),m:'This one rose differently. It looked over your other dead the way a sergeant looks over a muddy field, and they straightened under its gaze. You did not teach it that. Something it was in life remembered how to give orders, and the grave did not take it away.'},
  {act:5,id:'raid1',t:'An empty house',when:()=>T_('raidsSent')>=1,m:'You sent them out without you, and for the first time in a long while the house was quiet. No scraping at the door, no humming from the cellar. You sat with the Ledger open and realised you were listening for their footsteps, the way the living listen for children coming home late.'},
  {act:5,id:'raid10',t:'The war you do not see',when:()=>T_('raidWins')>=10,m:'Your squads come back with gold you did not earn and stories they cannot tell. The gates you cleared are being cleared again in your name, while you sleep. Somewhere a village has started telling tales of a dead captain who marches past at midnight and harms no one who keeps their door shut.'},
  {act:5,id:'rift1',t:'The torn sky',when:()=>riftBest()>=1,m:'Beneath the Throne of Ash the stone did not end. It tore. Through the tear you saw every gate at once, folded over itself, and the dead in it were not the dead you knew. They wore the shapes of the valley, but something older looked out through them. The Ledger grew warm in your hands and would not cool.'},
  {act:5,id:'rift10',t:'No bottom',when:()=>riftBest()>=10,m:'Ten times down, and the Rift only deepens. The pages you write there come back changed: names you did not set down, in a hand that is almost yours. The Pale Sovereign wrote himself out of this book. You begin to wonder if the Rift is where the ink went when he did.'},
  {act:5,id:'eternal1',t:'What does not end',when:()=>T_('eternal')>=1,m:'One of yours has grown past death and past age into something the Ledger has no word for. It does not tire. It does not forget. It stands at the edge of the Rift some nights and looks down, and when you ask it what it sees, it only turns the page of the book for you, gently, as if you were the one who needed keeping.'}
];
const STORY_BY=Object.fromEntries(STORY.map(s=>[s.id,s]));
const ACTS=['','Act I · The name','Act II · The valley','Act III · The climb','Act IV · The end of the book','Act V · The torn sky'];
// Milestone passages (those with a when) are checked after every action; inside a run they go to the room's events.
function loreCheck(){
  if(!S||!S.player) return; S.story=S.story||{};
  const due=STORY.filter(st=>{ if(!st.when||S.story[st.id]) return false; try{ return !!st.when(); }catch(e){ return false; } });
  if(due.length>2){ due.forEach(st=>{ S.story[st.id]=S.day; }); notify('The Ledger remembers '+due.length+' passages of your story. Read them on the Lore page (Ledger tab).','story'); return; }   /* catch-up, e.g. an old save */
  for(const st of due) unlockStory(st.id,S.mode==='raise'&&S.run?S.run:null);
}
// ===== TORN PAGES =====
// Twenty pages torn from the Ledger tell its history, always in order. Bosses, wardens, elites and coffers may hold the next
// one, but each page waits until you reach its level, so the story keeps pace with you. Kept through New Game+.
const LORE_PAGES=[
  {t:'The scribe of Vane Abbey',m:'Before the valley had a name, an abbey stood in the drowned chapel\'s place, and in it a scribe named Oswin Vane kept the record of the dead: who died, and when, and how. He believed no soul should be forgotten. It was a kind thought. It was the first mistake.'},
  {t:'The plague year',m:'In the plague year the dead came faster than Oswin could write. He worked by candle until his eyes failed, and still the names piled up unrecorded, and in the night he heard them weeping to be written. He prayed for a book that could keep up.'},
  {t:'The binding',m:'Something answered his prayer. Not the Old Gods; they were already old, and did not care for scribes. Oswin bound the new book in skin he did not ask the source of, and the ink in it was warm, and the pages filled themselves.'},
  {t:'A book that wants',m:'At first the Ledger only recorded. Then it began to want. A name written in it did not rest; it waited to be called. Oswin learned this the night his dead brother knocked on the abbey door, polite and grey, asking what he should do next.'},
  {t:'The first army',m:'The abbot ordered the book burned. It would not burn. Oswin, frightened, called the names in it to protect him, and the dead of the plague year rose and stood around the abbey in a silent ring, and the abbot\'s order was never given again.'},
  {t:'The drowning',m:'The abbey drowned when the river changed its course. Some say the river was pushed. Oswin went down with the chapel, the Ledger chained to his wrist, and for two hundred years the book lay in the dark water, writing the names of the fish.'},
  {t:'The tanner',m:'A tanner fished the book from the river and read one line aloud. By morning his vats were full of the dead and he was their king. He held his court beneath the city for forty years. The Ledger called him its second keeper, and forgot him the moment he fell.'},
  {t:'Keepers and wardens',m:'After the tanner the book passed from hand to hand, and every keeper left something behind: a warden at a door, a knight at a fire, a bishop and his choir. The gates of the valley are not dungeons. They are the graves of the Ledger\'s keepers.'},
  {t:'The orchard',m:'One keeper tried to stop it. She planted iron trees around the valley\'s graves to fence them from the book, and tended them until she was part of the orchard herself. It did not work. Iron does not stop ink. But the trees still stand.'},
  {t:'The Sovereign',m:'The greatest keeper called himself the Sovereign. He named every soul in the valley and ruled them all from a throne of ash. When there was no one left to name, he grew afraid the book would turn on him, and he did the only thing it could not undo.'},
  {t:'His own name',m:'The Sovereign wrote his own name in the Ledger, and the book closed on him like a door. He became its prisoner and its servant, a page among pages. That is why the last page waits blank: the book is always looking for its next keeper\'s name.'},
  {t:'The other half',m:'The Ledger was never whole. Long before Oswin\'s time, someone below had torn it in two and carried half away, down into a tower that grows a floor for every name it steals. The half you hold has been looking for the other half for a very long time.'},
  {t:'The Tower\'s bargain',m:'The King of Hell kept his half of the book in the Tower\'s heart and fed it the souls that climbed to him. Every warden on every tenth floor is a keeper who climbed for the other half and failed. Their relics are what the Tower let them keep.'},
  {t:'Why the dead obey',m:'The dead do not obey the Ledger because it is strong. They obey because it remembers them, and nothing else does. A name in the book is a name that cannot be lost. Most of them would rather serve than be forgotten. You find you understand.'},
  {t:'The price of keeping',m:'Each keeper paid in the same coin: a little more of themselves for every name. The tanner forgot his trade. The Warden forgot his family. The Sovereign forgot everything but the book. You check your own memories at night, and count them, and they are fewer.'},
  {t:'The masters below',m:'Under the keepers\' graves lie older things, masters who held the book before it was a book, when it was only a hunger in the dark. Oswin did not create the Ledger. He gave a shape to something that was already there, waiting to be written down.'},
  {t:'Oswin\'s regret',m:'In the margin of an early page, in a shaking hand, Oswin wrote: I wanted no one forgotten. I did not understand that some things are meant to be forgotten, and that remembering them forever is its own kind of grave.'},
  {t:'The whole book',m:'When the two halves meet, the Ledger will hold every name above and below. Whoever keeps it then will not rule the dead. They will be the dead\'s memory, the only thing between every soul and nothing. It is not a crown. It is a weight.'},
  {t:'How it ends',m:'There are only two endings, the scribe wrote. The keeper writes their own name and the book closes, as the Sovereign did, and the dead sleep at last. Or the keeper keeps writing, forever, and the dead never have to be alone.'},
  {t:'The blank page',m:'The last torn page holds no words at all, only the faint shape of a pen pressed hard and lifted again. Someone stood where you stand and could not decide. The page is yours now. The Ledger does not hurry you. It has all the time in the world.'}
];
const PAGE_LV=i=>2+i*3;   // page i waits until this level, so the story keeps pace (the last page at level 59)
const PAGE_CHANCE={boss:.35,warden:.5,elite:.04,coffer:.2,secret:1};
const nextPage=()=>{ const n=S.pages||0; return n<LORE_PAGES.length&&S.player.lvl>=PAGE_LV(n)?n:-1; };
function findPage(src,r){
  const n=nextPage(); if(n<0||!(Math.random()<(PAGE_CHANCE[src]||0))) return false;
  S.pages=n+1; tally('pages'); const P0=LORE_PAGES[n], m='You find a torn page of the Ledger ('+(n+1)+'/'+LORE_PAGES.length+'): "'+P0.t+'". Read it on the Lore page (Ledger tab).';
  if(r&&r.events) r.events.push({m,c:'story'}); else notify(m,'story'); moment('Torn page '+(n+1)+'/'+LORE_PAGES.length,'gold'); return true;
}
function unlockStory(id,r){
  const st=STORY_BY[id]; if(!st) return false; S.story=S.story||{}; if(S.story[id]) return false;
  S.story[id]=S.day; const m='From the Ledger, "'+st.t+'": '+st.m;
  if(r) r.events.push({m,c:'story'}); else notify(m,'story'); return true;
}

  'The Iron Inquisitor': ['Confess your names. All of them.','Absolved. We are all absolved.'],

SECRET.forEach(B=>{ BOSS_LINES[B.name]=B.lines; });
function bossSpeaks(e,when){ const L=BOSS_LINES[e.base]; if(!L) return; log(e.name+': "'+L[when==='hi'?0:1]+'"','boss'); }

// ===== BOSS PHASES =====
// At half HP a boss (gate or Tower) enters its second phase: its moves come a turn sooner, every move is announced a turn
// ahead, and it adds Sundering Blow. Taunt turns that blow onto a vanguard; a Focus crit or Grave Chill breaks any charging move.
const PHASE_AT=.5;
const PHASE_LINES={
  'The Rat King':'My court! To me, all of you, to me!',
  'The Crypt Warden':'Two hundred years. I will not be the one who fails.',
  'The Ember Knight':'Then let it all burn, and you with it!',
  'The Bishop of Teeth':'The choir will have your voice, scribe, one way or another.',
  'The Orchard Mother':'You would cut down my children? Then be pruned.',
  'The Pale Sovereign':'Enough. Let me show you what the book truly gave me.'
};
function checkPhase(){
  if(!S.run) return;
  for(const e of liveFoes()) if(e.boss&&e.abil&&!e.phase2&&(e.tw||e.rankI>=1)&&e.hp<=e.maxHp*PHASE_AT){   // the Rat King, a new player's first boss, keeps one phase
    e.phase2=true; e.fast=(e.fast||0)+1; e.alt=true; e.abilT=Math.min(e.abilT,2);   // Sundering Blow comes first
    const l=PHASE_LINES[e.base]; log(e.name+(l?': "'+l+'"':' rises in fury.'),'boss');

function fuse(ua,ub){

  const a=S.army.find(m=>m.uid===ua), b=S.army.find(m=>m.uid===ub); if(!canFuse(a,b)) return null;

  S.army=S.army.filter(m=>m!==x); checkEvolve(k); syncMinion(k); k.hp=k.maxHp; tally('fused'); sfx('raise'); return k;
}

const DUST_TIER=[1,1,2,4,7];

// ===== BATTLE EFFECTS (PixiJS layer) =====
// A transparent WebGL canvas over the battle cards that draws short strikes, sparks, wisps and ash. It only draws: no game
// rules, no Math.random (it has its own generator, so seeded tests and the balance bot see the same numbers), nothing saved.
// The library (lib/pixi.min.js, vendored) is loaded at runtime after the first render, and only while effects are allowed:
// Effects not Light, Reduce motion off, and the OS not asking for reduced motion. Without it (missing file, no WebGL, init
// error, or the Node test harness) every call below is a no-op and the game plays exactly as before.
// Game code calls fxe(kind, unit, opts) where it already logs a hit; render() calls fxSync() last, which loads or drops the
// layer and plays what this turn queued, placed on the cards by their data-u attribute (fxKey).
const FXL={st:'off',   // off | loading | init | ready | failed
  app:null,root:null,tex:null,live:[],pool:[],q:[],spy:null,tag:false,later:null,col:null,seed:0x2f6b1d,vis:false,
  MAX:300,QMAX:80};
const fxReduced=()=>{ try{ return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return true; } };
const fxAllowed=()=>{ try{ return !VIEW.calm&&!fxLight()&&!fxReduced(); }catch(e){ return false; } };
function fxRnd(){ let x=FXL.seed; x^=x<<13; x^=x>>>17; x^=x<<5; FXL.seed=x>>>0; return FXL.seed/4294967296; }   // xorshift32: never touches Math.random
const fxR=(a,b)=>a+(b-a)*fxRnd();

// Called by game code at each combat moment. Cheap when the layer is not running: one check and out.
function fxe(kind,u,o){
  if(FXL.spy) try{ FXL.spy(kind,fxKey(u),o||null); }catch(e){}
  if(FXL.st!=='ready'||FXL.q.length>=FXL.QMAX) return;
  const k=fxKey(u); if(k==null) return;
  FXL.q.push({kind,k,o:o||null,r:fxRect(k)});   // the card's place now, in case the next render removes it (the last kill ends the battle screen)
}
function fxEl(k){ try{ return typeof app!=='undefined'&&app&&app.querySelector?app.querySelector('[data-u="'+k+'"]'):null; }catch(e){ return null; } }
function fxBox(el){ if(!el||!el.getBoundingClientRect) return null; const b=el.getBoundingClientRect(); return b.width>0&&b.height>0?{x:b.left,y:b.top,w:b.width,h:b.height}:null; }
const fxRect=k=>fxBox(fxEl(k));
const fxAll=sel=>{ try{ return Array.from(app.querySelectorAll(sel)).map(fxBox).filter(Boolean); }catch(e){ return []; } };

// After every render: start loading, shut the layer when effects are switched off, or play the queue.
function fxSync(){
  if(!fxAllowed()){ if(FXL.st==='ready'||FXL.st==='init') fxDrop(); else if(FXL.st==='loading') FXL.st='off'; FXL.q.length=0; return; }
  if(FXL.st==='off') fxLoad();
  else if(FXL.st==='ready') fxFlush();
}
function fxLoad(){
  if(typeof document==='undefined'||typeof document.createElement!=='function') return;   // the Node harness has no DOM to draw in
  if(window.PIXI){ fxInit(); return; }
  const host=document.head||document.body; if(!host||typeof host.appendChild!=='function') return;
  FXL.st='loading'; if(FXL.tag) return;   // the file is already on its way; its onload carries on
  (FXL.later||setTimeout)(()=>{   // after the first paint, so startup never waits on a 900 KB file
    if(FXL.st!=='loading'||FXL.tag) return;   // switched off meanwhile
    try{
      const s=document.createElement('script'); s.src='lib/pixi.min.js'; s.async=true;   // relative: works from the local server and from disk
      s.onload=()=>{ if(FXL.st!=='loading') return; if(window.PIXI) fxInit(); else fxFail('PixiJS did not define PIXI'); };
      s.onerror=()=>fxFail('lib/pixi.min.js could not be loaded');

}

async function fxInit(){

  FXL.tex=null;
  try{ a.ticker.remove(fxStep); a.destroy({removeView:true},{children:true}); }catch(e){}
}
function fxClear(){   // drop every live effect and stop the ticker (tab hidden, layer dropped)
  FXL.q.length=0;
  for(const p of FXL.live) fxFree(p); FXL.live.length=0;
  const a=FXL.app; if(a) try{ a.render(); a.ticker.stop(); }catch(e){}

// ----- textures: drawn once with Graphics, no image files -----
function fxTextures(rd){
  const G=()=>new PIXI.Graphics(), T=g=>{ const t=rd.generateTexture({target:g,resolution:2}); g.destroy(); return t; };
  const dot=G(); for(let i=8;i>=1;i--) dot.circle(0,0,16*i/8).fill({color:0xffffff,alpha:.13});   // soft round glow
  const core=G().circle(0,0,4).fill(0xffffff);   // hard little ember
  const chip=G().poly([0,0,6,1.5,8,6,3,8.5,-1.5,4.5]).fill(0xffffff);   // a bone chip
  const streak=G().poly([0,6,40,0,96,4,100,6,96,8,40,12]).fill({color:0xffffff,alpha:.3}).poly([4,6,40,2.5,96,5.2,100,6,96,6.8,40,9.5]).fill(0xffffff);   // a tapered slash
  const ring=G().circle(0,0,30).stroke({width:8,color:0xffffff,alpha:.18}).circle(0,0,30).stroke({width:2.5,color:0xffffff,alpha:.9});
  return {dot:T(dot),core:T(core),chip:T(chip),streak:T(streak),ring:T(ring)};
}
function fxColours(){   // the page's own palette (CSS variables), never blue or purple
  const hex=(v,d)=>{ v=String(v||'').trim(); return /^#[0-9a-f]{6}$/i.test(v)?parseInt(v.slice(1),16):d; };
  let cs=null; try{ cs=getComputedStyle(document.documentElement); }catch(e){}
  const g=(n,d)=>cs?hex(cs.getPropertyValue(n),d):d;
  return {bone:g('--bone',0xe8dec6),ash:g('--mute',0x9a8f81),ember:g('--ember',0xe08a3c),soul:g('--soul',0x8fd46a),blood:g('--blood',0xb83a2a),gold:g('--gold',0xd3a64d),ward:g('--ward',0xddd3b8),soot:0x1c1410};
}

// ----- particles: pooled sprites, at most FXL.MAX alive (the oldest go first) -----
function fxFree(p){ const s=p.s; s.visible=false; if(s.parent) s.parent.removeChild(s); FXL.pool.push(s); }
function fxP(o){   // o: tex, x, y, tint, life (ms), and optionally delay, vx, vy (px/ms), g, a0, a1, sx0, sx1, sy0, sy1, rot, vr, add, fi, path
  const L=FXL.live; if(L.length>=FXL.MAX) fxFree(L.shift());
  const s=FXL.pool.pop()||new PIXI.Sprite(); s.texture=FXL.tex[o.tex]; s.anchor.set(.5); s.tint=o.tint; s.blendMode=o.add?'add':'normal'; s.visible=false; s.alpha=0;
  FXL.root.addChild(s);
  const sx0=o.sx0==null?1:o.sx0, sy0=o.sy0==null?sx0:o.sy0;
  const p={s,x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g||0,age:-(o.delay||0),life:o.life,a0:o.a0==null?1:o.a0,a1:o.a1||0,sx0,sy0,sx1:o.sx1==null?sx0:o.sx1,sy1:o.sy1==null?(o.sx1==null?sy0:o.sx1*(sy0/sx0)):o.sy1,rot:o.rot||0,vr:o.vr||0,fi:o.fi||0,path:o.path||null};
  L.push(p); return p;
}
function fxStep(tk){
  const dt=Math.min(50,tk.deltaMS), L=FXL.live;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i], s=p.s; p.age+=dt;
    if(p.age<0) continue;
    const k=p.age/p.life; if(k>=1){ fxFree(p); L.splice(i,1); continue; }
    if(p.path){ const P=p.path, e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, u=1-e; p.x=u*u*P[0]+2*u*e*P[2]+e*e*P[4]; p.y=u*u*P[1]+2*u*e*P[3]+e*e*P[5]; }
    else { p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    p.rot+=p.vr*dt; const eo=1-(1-k)*(1-k);
    s.visible=true; s.x=p.x; s.y=p.y; s.rotation=p.rot;
    s.scale.set(p.sx0+(p.sx1-p.sx0)*eo,p.sy0+(p.sy1-p.sy0)*eo);
    s.alpha=(p.a0+(p.a1-p.a0)*k)*(p.fi&&k<p.fi?k/p.fi:1);
  }
  if(!L.length){ try{ FXL.app.render(); }catch(e){} FXL.app.ticker.stop(); }   // last frame drawn empty, then no more frames until the next effect
}
function fxGo(){ const a=FXL.app; if(a&&FXL.live.length&&!a.ticker.started) a.ticker.start(); }

// ----- the effects (all short: about 250-700 ms) -----
const fxC=r=>({x:r.x+r.w/2,y:r.y+r.h/2});
function fxChips(c,n,t,col,big){   // bone and ash chips thrown out and falling
  for(let i=0;i<n;i++){ const a=fxR(-Math.PI,0), v=fxR(.08,.22)*(big?1.4:1);
    fxP({tex:'chip',x:c.x+fxR(-6,6),y:c.y+fxR(-6,6),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0009,life:fxR(380,620),delay:t,tint:i%3===0?col.ash:i%5===4&&big?col.gold:col.bone,sx0:fxR(.6,1.1)*(big?1.3:1),rot:fxR(0,6.3),vr:fxR(-.02,.02),a0:.9}); }
}
function fxSlash(r,t,col,crit){
  const c=fxC(r), len=Math.min(r.w,r.h)*(crit?1.25:1)/100;
  fxP({tex:'streak',x:c.x,y:c.y,rot:-.75,sx0:len*.25,sx1:len,sy0:crit?1.1:.8,sy1:crit?.7:.5,life:crit?320:260,delay:t,tint:col.bone,add:1,a0:.9});
  if(crit){ fxP({tex:'streak',x:c.x,y:c.y,rot:.65,sx0:len*.2,sx1:len*.85,sy0:.9,sy1:.5,life:300,delay:t+50,tint:col.gold,add:1,a0:.8});
    fxP({tex:'dot',x:c.x,y:c.y,sx0:r.w/40,sx1:r.w/22,life:320,delay:t,tint:col.gold,add:1,a0:.5}); }
  fxChips(c,crit?9:5,t+30,col,crit);
}
function fxSpark(r,t,col,n){
  const c=fxC(r), x=c.x+fxR(-r.w*.25,r.w*.25), y=c.y+fxR(-r.h*.2,r.h*.2);
  fxP({tex:'dot',x,y,sx0:.5,sx1:.9,life:220,delay:t,tint:col.ember,add:1,a0:.45});
  for(let i=0;i<n;i++){ const a=fxR(0,6.3), v=fxR(.06,.16); fxP({tex:'core',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0004,life:fxR(200,320),delay:t,tint:i%2?col.bone:col.ember,add:1,sx0:fxR(.35,.6),sx1:.15,a0:.9}); }
}
function fxHurt(r,t,col,o){
  const c=fxC(r), tint=o&&o.fire?col.ember:col.blood, big=o&&o.crit;
  fxP({tex:'dot',x:c.x,y:c.y,sx0:r.w/50,sy0:r.h/50,sx1:r.w/34,sy1:r.h/34,life:big?420:320,delay:t,tint,add:o&&o.fire?1:0,a0:big?.55:.4});
  for(let i=0;i<(big?7:4);i++){ const a=fxR(-2.6,-.5), v=fxR(.05,.14); fxP({tex:'core',x:c.x+fxR(-10,10),y:c.y+fxR(-8,8),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0008,life:fxR(350,500),delay:t,tint,sx0:fxR(.4,.75),sx1:.3,a0:.85}); }
}
function fxSiphon(from,to,t,col,n){
  const a=fxC(from), b=fxC(to), dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
  for(let i=0;i<n;i++){ const bend=fxR(-.45,.45)*d, mx=(a.x+b.x)/2-dy/d*bend, my=(a.y+b.y)/2+dx/d*bend, path=[a.x+fxR(-12,12),a.y+fxR(-10,10),mx,my,b.x,b.y], life=fxR(440,600), dl=t+i*28;
    fxP({tex:'dot',x:a.x,y:a.y,path,life,delay:dl,tint:col.soul,add:1,sx0:.7,sx1:.35,a0:.5,a1:.15,fi:.2});
    fxP({tex:'core',x:a.x,y:a.y,path,life,delay:dl,tint:col.soul,add:1,sx0:.7,sx1:.4,a0:.95,a1:.4,fi:.15}); }
}
function fxWard(r,t,col,strong){
  const c=fxC(r);
  fxP({tex:'ring',x:c.x,y:c.y,sx0:r.w/64,sy0:r.h/64,sx1:r.w/56,sy1:r.h/56,life:strong?600:460,delay:t,tint:col.ward,add:1,a0:strong?.75:.5});
  for(let i=0;i<(strong?8:5);i++) fxP({tex:'core',x:r.x+fxR(.1,.9)*r.w,y:r.y+fxR(.2,.9)*r.h,vy:-fxR(.02,.05),life:fxR(350,520),delay:t+fxR(0,120),tint:col.ward,add:1,sx0:.45,sx1:.1,a0:.8,fi:.3});
}
function fxSpear(from,to,t,col){
  const a=fxC(from), b=fxC(to), ang=Math.atan2(b.y-a.y,b.x-a.x), fly=220;
  fxP({tex:'streak',x:a.x,y:a.y,path:[a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2,b.x,b.y],rot:ang,sx0:.9,sx1:1.1,sy0:.7,life:fly,delay:t,tint:col.bone,add:1,a0:.95,a1:.8});
  fxSlash(to,t+fly-20,col,false);
}
function fxDeath(r,t,col,ember){
  const c=fxC(r);
  fxP({tex:'dot',x:c.x,y:c.y,sx0:r.w/60,sx1:r.w/30,life:600,delay:t,tint:ember?col.ember:col.soot,add:ember?1:0,a0:ember?.35:.55});
  for(let i=0;i<14;i++) fxP({tex:i%3?'chip':'core',x:r.x+fxR(.15,.85)*r.w,y:r.y+fxR(.15,.6)*r.h,vx:fxR(-.03,.03),vy:fxR(-.06,.01),g:.0007,life:fxR(480,700),delay:t+fxR(0,80),tint:i%4===0?col.bone:ember&&i%2?col.ember:col.ash,sx0:fxR(.5,1),sx1:.4,rot:fxR(0,6.3),vr:fxR(-.012,.012),a0:.9});
}
function fxMotes(r,t,col,n,tint){
  for(let i=0;i<n;i++) fxP({tex:i%2?'core':'dot',x:r.x+fxR(.15,.85)*r.w,y:r.y+fxR(.5,.95)*r.h,vx:fxR(-.012,.012),vy:-fxR(.05,.11),life:fxR(560,700),delay:t+fxR(0,160),tint:tint||col.soul,add:1,sx0:i%2?fxR(.5,.8):fxR(.35,.55),sx1:.15,a0:i%2?.9:.4,fi:.25});

  fxP({tex:'ring',x:c.x,y:c.y,sx0:r.w/80,sx1:r.w/36,life:700,delay:t+60,tint:col.ember,add:1,a0:.35});
  for(let i=0;i<10;i++) fxP({tex:'core',x:r.x+fxR(.1,.9)*r.w,y:r.y+r.h*fxR(.7,1),vx:fxR(-.015,.015),vy:-fxR(.04,.09),life:fxR(500,700),delay:t+fxR(80,260),tint:i%3?col.ember:col.gold,add:1,sx0:fxR(.35,.6),sx1:.1,a0:.9,fi:.2});

function fxUlt(e,r,col){   // one stronger version of the fitting effect, across the room

  if(id==='toll') foes.forEach((f,i)=>{ fxSlash(f,i*40,col,true); fxDeath(f,i*40+120,col,true); });
  else if(id==='rise') ours.forEach((f,i)=>fxMotes(f,i*35,col,i?6:12));
  else (foes.length?foes:r?[r]:[]).forEach((f,i)=>fxWard(f,i*40,col,true));
}

// Plays the queued moments in order on a short clock, so a full army's turn reads as a flurry rather than one flash.
function fxFlush(){
  const q=FXL.q; FXL.q=[]; if(!q.length) return;
  const col=FXL.col, me=()=>fxRect('p'), nM=q.filter(e=>e.kind==='mhit').length, sparks=nM>8?2:nM>4?3:4;
  let t=0, prev=0;
  for(const e of q){
    if(t>1600) break;   // a very long turn: the rest would play long after the numbers changed
    const r=fxRect(e.k)||e.r; if(!r&&e.kind!=='ult') continue;
    let at=t;
    switch(e.kind){
      case 'strike': fxSlash(r,at,col,e.o&&e.o.crit); t+=120; break;
      case 'mhit': fxSpark(r,at,col,sparks); t+=nM>8?35:55; break;
      case 'hurt': fxHurt(r,at,col,e.o); t+=e.o&&e.o.fire?25:90; break;
      case 'siphon': { const m=me(); if(m) fxSiphon(r,m,at,col,7); t+=200; break; }
      case 'spear': { const m=me(); if(m) fxSpear(m,r,at,col); else fxSlash(r,at,col,false); t+=260; break; }
      case 'ward': fxWard(r,at,col,false); t+=30; break;
      case 'burst': fxDeath(r,at,col,true); t+=40; break;
      case 'death': at=prev+60; fxDeath(r,at,col,false); break;
      case 'raise': fxMotes(r,at,col,12); t+=110; break;
      case 'rfail': fxWisp(r,at,col); t+=110; break;
      case 'mend': fxMotes(r,at,col,8); break;
      case 'boss': fxBoss(r,at,col); break;
      case 'ult': fxUlt(e,r,col); t+=300; break;
    }
    prev=at;
  }
  fxGo();
}

"A separate climb from the gates. Each floor is a single fight; between floors you raise the dead and climb on. A warden waits on every tenth floor and carries a unique relic. The first time you break a warden its unique is guaranteed. After that it drops #% of the time, as gold if you already carry it. Wardens grow wrathful if the fight drags on. A climb uses one watch, and floors you have cleared become checkpoints. Tower foes wear #% armor":"Kapılardan ayrı bir tırmanış. Her kat tek bir dövüştür; katlar arasında ölüleri diriltir ve tırmanmaya devam edersin. Her onuncu katta eşsiz bir emanet taşıyan bir muhafız bekler. Bir muhafızı ilk kez kırdığında eşsizi garantilidir. Sonra %# oranında düşer, zaten taşıyorsan altın olarak. Dövüş uzarsa muhafızlar gazaplanır. Bir tırmanış bir nöbet harcar ve temizlediğin katlar kontrol noktası olur. Kule düşmanları %# zırh giyer",

"Abaddon kept the other half of the book. When he falls, his pages fly to yours and stitch themselves in. The Ledger is whole for the first time in a thousand years, and every soul in it, above and below, now answers to you":"Abaddon kitabın diğer yarısını saklıyordu. Düştüğünde sayfaları seninkine uçar ve kendilerini diker. Defter bin yıldır ilk kez bütün ve içindeki her ruh, yukarıda ve aşağıda, artık sana cevap veriyor",

"About one foe in ten is an elite: #% more HP, #% more attack, more XP, gold, trophies and better drops, and harder to raise. Every elite carries a named affix, two in the Hollow Cathedral and deeper and from Tower floor #":"Yaklaşık on düşmandan biri seçkindir: %# daha fazla can, %# daha fazla saldırı, daha çok TP, altın, ganimet ve daha iyi düşüşler, ve diriltmesi daha zordur. Her seçkin adlı bir ek taşır; Hollow Cathedral ve daha derinde ve Kule katı #'den itibaren iki tane",

"After each gate room you choose the next from two or three doors. The first is always an ordinary fight; the room before the boss leads only to the boss":"Her kapı odasından sonra sonrakini iki ya da üç kapı arasından seçersin. İlki her zaman sıradan bir dövüştür; bosstan önceki oda yalnızca bossa çıkar",
"After the tanner the book passed from hand to hand, and every keeper left something behind: a warden at a door, a knight at a fire, a bishop and his choir. The gates of the valley are not dungeons. They are the graves of the Ledger's keepers":"Tabaktan sonra kitap elden ele geçti ve her bekçi geride bir şey bıraktı: bir kapıda bir muhafız, bir ateşte bir şövalye, bir piskopos ve korosu. Vadinin kapıları zindan değil. Onlar Defterin bekçilerinin mezarları",

"One hundred and fifty floors. The wardens here have no stories, no faces, no names at all; they are what is left when the Ledger has taken everything else. You wonder, briefly, whether that is what you are climbing toward":"Yüz elli kat. Buradaki muhafızların hikâyesi, yüzü, hiç adı yok; onlar Defter her şeyi aldığında geriye kalanlar. Bir an, tırmandığın şeyin bu olup olmadığını merak ediyorsun",

"One keeper tried to stop it. She planted iron trees around the valley's graves to fence them from the book, and tended them until she was part of the orchard herself. It did not work. Iron does not stop ink. But the trees still stand":"Bir bekçi onu durdurmaya çalıştı. Vadinin mezarlarını kitaptan korumak için etrafına demir ağaçlar dikti ve kendisi bahçenin bir parçası olana kadar onlara baktı. İşe yaramadı. Demir mürekkebi durdurmaz. Ama ağaçlar hâlâ ayakta",

"Ten times down, and the Rift only deepens. The pages you write there come back changed: names you did not set down, in a hand that is almost yours. The Pale Sovereign wrote himself out of this book. You begin to wonder if the Rift is where the ink went when he did":"On kez indin ve Yarık yalnızca derinleşiyor. Orada yazdığın sayfalar değişmiş dönüyor: senin yazmadığın isimler, neredeyse senin olan bir el yazısıyla. Solgun Hükümdar kendini bu kitaptan yazarak çıkardı. Mürekkebin o zaman Yarığa gidip gitmediğini merak etmeye başlıyorsun",

"The Bishop preached that the dead should keep their voices. His choir sang for a century without breath. When he fell, the Ledger turned to a page already written, in your handwriting, that you do not remember writing":"Piskopos ölülerin seslerini korumaları gerektiğini vaaz etti. Korosu nefes almadan bir yüzyıl şarkı söyledi. Düştüğünde Defter, senin el yazınla zaten yazılmış, yazdığını hatırlamadığın bir sayfaya döndü",

"The Gate Hound was not guarding the Tower from you. It was guarding the valley from the Tower. When it fell, it looked almost relieved, and the stair above it lit itself, step by step, all the way up into the dark":"Kapı Tazısı Kuleyi senden korumuyordu. Vadiyi Kuleden koruyordu. Düştüğünde neredeyse rahatlamış görünüyordu ve üstündeki merdiven basamak basamak, karanlığın ta yukarısına kadar kendiliğinden aydınlandı",

"The King of Hell kept his half of the book in the Tower's heart and fed it the souls that climbed to him. Every warden on every tenth floor is a keeper who climbed for the other half and failed. Their relics are what the Tower let them keep":"Cehennemin Kralı kitabın kendi yarısını Kulenin kalbinde tuttu ve onu kendisine tırmanan ruhlarla besledi. Her onuncu kattaki her muhafız, diğer yarı için tırmanıp başarısız olan bir bekçidir. Emanetleri, Kulenin onlara bıraktıklarıdır",

"The Ledger remembers # passages of your story. Read them on the Lore page (Ledger tab)":"Defter hikâyenin # bölümünü hatırlıyor. Hikâye sayfasında oku (Defter sekmesi)",
"The Ledger tab keeps your best: deepest floor, biggest hit, most kills, and the fastest clear of each gate. Beat one and you will hear about it":"Defter sekmesi en iyilerini saklar: en derin kat, en büyük vuruş, en çok öldürme ve her kapının en hızlı temizlenmesi. Birini geçersen haberin olur",
"The Ledger tells its story in four acts as you play, and # torn pages tell its history in order. Bosses (#%), Tower wardens (#%), elites (#%) and sealed coffers (#%) may hold the next page, and secret masters always do; page N waits until level # + # per page. Read them on the Lore page":"Defter oynadıkça hikâyesini perdeler hâlinde anlatır ve # yırtık sayfa tarihini sırayla anlatır. Bosslar (%#), Kule muhafızları (%#), seçkinler (%#) ve mühürlü sandıklar (%#) bir sonraki sayfayı taşıyabilir, gizli efendiler her zaman taşır; N. sayfa seviye # + sayfa başına #'e kadar bekler. Hikâye sayfasında oku",
"The Ledger was never whole. Long before Oswin's time, someone below had torn it in two and carried half away, down into a tower that grows a floor for every name it steals. The half you hold has been looking for the other half for a very long time":"Defter hiç bütün olmadı. Oswin'in zamanından çok önce aşağıdaki biri onu ikiye yırttı ve yarısını, çaldığı her isim için bir kat büyüyen bir kuleye taşıdı. Tuttuğun yarı çok uzun zamandır diğer yarıyı arıyor",

"The Mother planted iron in the ground and grew a forest of it, to fence in her children. You learn too late that her children were the graves of the valley, and that the Ledger had been eating them one name at a time":"Ana toprağa demir dikti ve çocuklarını çevirmek için ondan bir orman büyüttü. Çocuklarının vadinin mezarları olduğunu ve Defterin onları birer isim birer isim yediğini çok geç öğreniyorsun",

"The Pale Executioner kept a tally of everyone he had ended. You found it carved into the block: a long column of marks, and at the very bottom, freshly cut, a mark for you. You chiselled it out before you climbed on":"Solgun Cellat sonunu getirdiği herkesin sayısını tutuyordu. Onu kütüğe oyulmuş buldun: uzun bir çentik sütunu ve en altta, yeni kazınmış, senin için bir çentik. Tırmanmaya devam etmeden önce onu kazıyıp sildin",
"The Rat King was a tanner once, buried under his own vats. He held his court of vermin for forty years, waiting for someone to tell him he could stop. The Ledger wrote his name in a careful hand, and somewhere beneath the city a second page filled itself in":"Rat King bir zamanlar kendi teknelerinin altına gömülmüş bir tabaktı. Haşere sarayını kırk yıl tuttu, birinin ona durabileceğini söylemesini bekleyerek. Defter adını özenli bir elle yazdı ve şehrin altında bir yerde ikinci bir sayfa kendiliğinden doldu",

"The Seraph fell without a sound, and its halo cracked in two. One half held the light of something holy. The other held a name written in the Ledger's hand. You could not tell which half was heavier":"Seraf ses çıkarmadan düştü ve halesi ikiye çatladı. Bir yarısı kutsal bir şeyin ışığını taşıyordu. Diğeri Defterin elinden yazılmış bir ismi. Hangi yarının daha ağır olduğunu söyleyemedin",
"The Sovereign":"Hükümdar",
"The Sovereign was the last to hold the Ledger before you. He wrote until there were no names left but his own, and then he wrote that one too. His court kneels to you now. The book has a new final page, and it is blank, and it is waiting":"Hükümdar, senden önce Defteri tutan son kişiydi. Kendi adından başka isim kalmayana kadar yazdı, sonra onu da yazdı. Sarayı şimdi sana diz çöküyor. Kitabın yeni bir son sayfası var; boş ve bekliyor",
"The Sovereign wrote his own name in the Ledger, and the book closed on him like a door. He became its prisoner and its servant, a page among pages. That is why the last page waits blank: the book is always looking for its next keeper's name":"Hükümdar kendi adını Deftere yazdı ve kitap üstüne bir kapı gibi kapandı. Onun mahkûmu ve hizmetkârı oldu, sayfalar arasında bir sayfa. Son sayfanın boş beklemesinin sebebi bu: kitap her zaman bir sonraki bekçisinin adını arıyor",
"The Titles tab filters by earned, locked, close to earning and rarity, and titles that count something show how far along you are":"Unvanlar sekmesi kazanılan, kilitli, kazanılmak üzere ve nadirliğe göre süzer; bir şey sayan unvanlar ne kadar ilerlediğini gösterir",
"The Tower notices":"Kule fark ediyor",

"The Warden kept his post long after the family he guarded had rotted. He did not fight you for treasure. He fought because no one had ever relieved him of his watch. In the Ledger his entry ends with a single word: dismissed":"Muhafız, koruduğu aile çürüdükten çok sonra da nöbetini tuttu. Seninle hazine için savaşmadı. Kimse onu nöbetinden almadığı için savaştı. Defterde kaydı tek bir kelimeyle bitiyor: görevden alındı",
"The Warden kept the door. I kept what lay beneath it. Kneel in the water":"Muhafız kapıyı tuttu. Ben altında yatanı tuttum. Suda diz çök",
"The abbey drowned when the river changed its course. Some say the river was pushed. Oswin went down with the chapel, the Ledger chained to his wrist, and for two hundred years the book lay in the dark water, writing the names of the fish":"Nehir yatağını değiştirdiğinde manastır boğuldu. Bazıları nehrin itildiğini söyler. Oswin, Defter bileğine zincirli, şapelle birlikte battı ve kitap iki yüz yıl boyunca karanlık suda yatıp balıkların isimlerini yazdı",
"The abbot ordered the book burned. It would not burn. Oswin, frightened, called the names in it to protect him, and the dead of the plague year rose and stood around the abbey in a silent ring, and the abbot's order was never given again":"Başrahip kitabın yakılmasını emretti. Yanmadı. Korkan Oswin onu korumaları için içindeki isimleri çağırdı; veba yılının ölüleri kalktı ve manastırın etrafında sessiz bir halka olup durdu, ve başrahibin emri bir daha hiç verilmedi",
"The air thickens":"Hava ağırlaşıyor",
"The air turns wrong":"Hava bozuluyor",

"The dead pay well for what the living leave behind. Sell trophies and spare gear here, and buy supplies before you go down. The merchant's wares change every dawn":"Ölüler, yaşayanların geride bıraktığına iyi para öder. Ganimetleri ve yedek teçhizatı burada sat, aşağı inmeden erzak al. Tüccarın malları her şafak değişir",

const ITEM_HUE={weapon:'#6f665a',armor:'#5f5a52',relic:'#6e5e40'};   // gear is painted in worn steel, leather and brass; rarity shows on the frame and the name
function iico(d){ const set=!d.uq&&!d.tower&&RANKS[d.set]!=null;   // each gate's set has its own metal and its rank letter in the corner
  return '<span class="ico t'+d.tier+(set?' s'+d.set:'')+'" aria-hidden="true"><svg viewBox="0 0 64 64" class="mt-metal" style="color:'+(ITEM_HUE[d.slot]||'#6a655c')+'"><g filter="url(#paint)">'+(IC[d.glyph||('i_'+d.kind)]||IC._)+'</g></svg>'+(set?'<span class="rb gl r'+d.set+'">'+RANKS[d.set]+'</span>':'')+'</span>'; }
const statTxt=(k,v)=>(v>0?'+':'&minus;')+Math.abs(v)+STATL[k][1]+' '+STATL[k][0];
function statsHTML(d,it){ return Object.keys(d.stats).filter(k=>d.stats[k]).map(k=>'<span>'+statTxt(k,d.stats[k])+'</span>').join('')
  +((it&&it.ro)||[]).map(r=>'<span class="roll" title="Bonus line">'+statTxt(r[0],r[1])+'</span>').join(''); }
function cmpHTML(it){   // what wearing this would change, against what is in that slot now
  const d=ITEM[it.id], cur=S.equip[d.slot]; if(cur&&cur.u===it.u) return '';
  if(!cur) return '<div class="cmp">Your '+SLOTS[d.slot].toLowerCase()+' slot is empty.</div>';
  const a=itStats(it), b=itStats(cur), keys=[...new Set(Object.keys(a).concat(Object.keys(b)))].filter(k=>(a[k]||0)!==(b[k]||0));
  return '<div class="cmp">vs '+ITEM[cur.id].name+': '+(keys.length?keys.map(k=>{ const v=(a[k]||0)-(b[k]||0); return '<span class="'+(v>0?'up':'down')+'">'+statTxt(k,v)+'</span>'; }).join(''):'<span>same stats</span>')+'</div>';
}
function usetLine(d){ if(d.uset==null) return ''; const U=USET[d.uset], n=usetCount(d.uset), worn=id=>GEAR_SLOTS.some(sl=>S.equip[sl]&&S.equip[sl].id===id);
  return '<div class="setl uset">Unique set: <b>'+U.name+'</b>'+(n?' ('+n+'/3 worn)':'')+' &middot; '+U.ids.map(id=>'<span class="'+(worn(id)?'on':'')+'">'+ITEM[id].name+'</span>').join(', ')
   +'<br><span class="'+(n>=2?'on':'')+'">2: '+buffTxt(U.b[2])+'</span> &middot; <span class="'+(n>=3?'on':'')+'">3: '+buffTxt(U.b[3])+'</span></div>'; }
function setLine(d){ if(d.tower||SET_NAMES[d.set]==null) return usetLine(d); const n=setCount(d.set), B=SET_BONUS[d.set];
  return '<div class="setl">'+SET_NAMES[d.set]+' set'+(n?' ('+n+'/3 worn)':'')+': <span class="'+(n>=2?'on':'')+'">2: '+buffTxt(B[2])+'</span> &middot; <span class="'+(n>=3?'on':'')+'">3: '+buffTxt(B[3])+'</span></div>'+usetLine(d); }
function itemCard(it,acts,cmp){
  const d=ITEM[it.id];
  return '<div class="item t'+d.tier+'">'+iico(d)+'<div class="i-body"><div class="i-top"><span class="i-name">'+d.name+'</span><span class="i-tag">'+TIERS[d.tier]+' &middot; '+SLOTS[d.slot]+(!d.uq&&!d.tower&&RANKS[d.set]?'<span class="sr"> &middot; gate '+RANKS[d.set]+' set</span>':'')+(d.tower?' &middot; <span class="i-floor">Hell Tower '+d.floor+'</span>':'')+'</span></div>'
   +'<div class="i-stats">'+statsHTML(d,it)+'</div>'+(d.flag?'<div class="i-fx">'+FLAGS[d.flag]+'</div>':'')+setLine(d)+(cmp?cmpHTML(it):'')+'</div><div class="i-acts">'+(acts||'')+'</div></div>';
}
const lockBtn=it=>'<button class="btn small lockb'+(it.lk?' on':'')+'" data-a="lock" data-k="'+it.u+'" aria-pressed="'+!!it.lk+'" title="'+(it.lk?'Locked: never sold, salvaged or discarded. Press to unlock.':'Lock it so it is never sold, salvaged or discarded')+'">'+(it.lk?'Locked':'Lock')+'</button>';
const reforgeBtn=it=>ITEM[it.id].uq||S.mode!=='town'?'':'<button class="btn small" data-a="reforge" data-k="'+it.u+'"'+(S.gold<reforgeCost(it)?' disabled':'')+' title="Re-roll its bonus lines">Reforge &middot; '+gold(reforgeCost(it))+'</button>'+enchBtn(it);
const dust=n=>'<span class="dust-n">'+n.toLocaleString()+' dust</span>';
function enchBtn(it){   // Enchant opens the choices: add a line (if there is room) or re-roll one line
  if(ITEM[it.id].uq||S.mode!=='town'||!workOpen()) return '';
  const open=ui.ench===it.u, c=enchCost(it), poor=(S.dust||0)<c, ro=it.ro||[];
  let h='<button class="btn small" data-a="ench" data-k="'+it.u+'" aria-expanded="'+open+'" title="Spend bone dust on its bonus lines">Enchant</button>';
  if(open) h+='<div class="ench">'+(ro.length<lineMax(it)?'<button class="btn small primary" data-a="enchadd" data-k="'+it.u+'"'+(poor?' disabled':'')+'>Add a line &middot; '+dust(c)+'</button>':'')
    +ro.map((r,i)=>'<button class="btn small" data-a="enchline" data-k="'+it.u+'|'+i+'"'+(poor?' disabled':'')+'>Re-roll '+statTxt(r[0],r[1])+' &middot; '+dust(c)+'</button>').join('')
    +(!ro.length&&!lineMax(it)?'<span class="u-sub">Common gear has no room for a bonus line.</span>':'')+'</div>';
  return h;
}
const pc=p=>{ p*=100; return (p>=10?p.toFixed(0):p>=1?p.toFixed(1):p.toFixed(2))+'%'; };
function equipHTML(){
  const locked=S.mode==='battle';

   +USET.map((U,i)=>({U,c:usetCount(i)})).filter(x=>x.c>=2).map(x=>'<p class="q-note uset-on">'+x.U.name+' ('+x.c+'/3): '+buffTxt(x.U.b[2])+(x.c>=3?', '+buffTxt(x.U.b[3]):'')+'</p>').join('')+(locked?'<p class="q-note">Gear is locked while you fight.</p>':'')+'</section>';

const BAG_SORTS={tier:'Best first',slot:'By slot',new:'Newest'};
function sortedBag(){
  const by=ui.sort||'tier', D=it=>ITEM[it.id], score=it=>D(it).tier*100+D(it).set*10+((it.ro&&it.ro.length)||0);
  const order={weapon:0,armor:1,relic:2};
  return S.inv.slice().sort(by==='new'?(a,b)=>b.u-a.u:by==='slot'?(a,b)=>order[D(a).slot]-order[D(b).slot]||score(b)-score(a):(a,b)=>score(b)-score(a)||D(a).name.localeCompare(D(b).name));
}
function junkHTML(){
  const j=S.inv.filter(isJunk); if(!j.length||S.mode!=='town') return '';
  const g=j.reduce((a,it)=>a+sellValue(it),0);
  return '<button class="btn small warn" data-a="junk">'+(ui.confirm==='junk'?'Press again to sell '+j.length+' for '+gold(g):'Sell junk ('+j.length+' Common and Uncommon) &middot; '+gold(g))+'</button>';
}
function tierBulkHTML(kind){   // kind 'sell' or 'salv'
  if(S.mode!=='town'||(kind==='salv'&&!workOpen())) return '';
  return BULK_TIERS.map(t=>{ const lot=tierLot(t); if(!lot.length) return ''; const key=(kind==='sell'?'st':'sv')+t;
    const v=lot.reduce((a,it)=>a+(kind==='sell'?sellValue(it):dustValue(it)),0), price=kind==='sell'?gold(v):dust(v);
    return '<button class="btn small bulk t'+t+'" data-a="'+(kind==='sell'?'selltier':'salvtier')+'" data-k="'+t+'">'+(ui.confirm===key?'Press again: '+lot.length+' for '+price:(kind==='sell'?'Sell':'Salvage')+' '+TIERS[t]+' ('+lot.length+') &middot; '+price)+'</button>'; }).join(''); }
function salvJunkHTML(){
  const j=S.inv.filter(isJunk); if(!j.length||S.mode!=='town'||!workOpen()) return '';
  const n=j.reduce((a,it)=>a+dustValue(it),0);
  return '<button class="btn small" data-a="sjunk">'+(ui.confirm==='sjunk'?'Press again to salvage '+j.length+' for '+dust(n):'Salvage junk &middot; '+dust(n))+'</button>';
}
function bagHTML(){
  const rows=sortedBag().map(it=>{ const d=ITEM[it.id], cur=S.equip[d.slot], conf=ui.confirm==='d'+it.u;
    return itemCard(it,'<button class="btn small primary" data-a="equip" data-k="'+it.u+'">'+(cur?'Swap':'Equip')+'</button>'+(d.uq?'':lockBtn(it))
      +reforgeBtn(it)
      +(d.uq||it.lk?'':(workOpen()?'<button class="btn small" data-a="salvage" data-k="'+it.u+'" title="Break it into bone dust">Salvage &middot; '

   +(S.inv.length?'<div class="bag-tools">Sort: '+Object.keys(BAG_SORTS).map(k=>'<button class="linkbtn" data-a="sort" data-k="'+k+'" aria-pressed="'+((ui.sort||'tier')===k)+'">'+BAG_SORTS[k]+'</button>').join('')+junkHTML()+salvJunkHTML()+tierBulkHTML('salv')+'</div>':'')

function traitChips(m){

    +(next!=null?'<span class="evo">Evolves at Lv '+next+'</span>':stage===STAGE_MAX?'<span class="evo">Eternal</span>':'')+'</div>';

function besExtra(tkey,abil){   // trophy and boss move, shown on every opened bestiary entry (known from the first kill)
  const t=TROPHY[tkey], A=abil&&BOSS_ABIL[abil];
  return '<div class="bes-extra">'+(t?'<div class="u-sub"><b>Trophy:</b> '+t.name+' &middot; '+gold(t.value)+' each'+(tkey.startsWith('b:')?' &middot; counts as 5 at the forge':'')+'</div>':'')
    +(A?'<div class="u-sub"><b>Signature move:</b> '+A.name+(A.warn?' (telegraphed)':'')+' &middot; '+A.desc+'</div>':'')+'</div>';
}
function bestiaryHTML(){
  const all=[]; DUNGEONS.forEach(D=>{ D.mobs.forEach(m=>all.push(m[0])); all.push(D.boss[0]); });
  const kn=n=>(S.kills&&S.kills[n])||0;
  const met=all.filter(n=>kn(n)>0).length, studied=all.filter(n=>kn(n)>=KNOW_AT).length;
  let h='<section class="win" aria-labelledby="h-bes"><h2 class="win-h" id="h-bes">Bestiary &amp; drop tables</h2>'
   +'<p class="lede">Entries stay hidden until you kill the creature. Defeat one '+KNOW_AT+' times to study it and reveal its drop table. Ordinary enemies drop something 28% of the time, elites 65% with a lean toward better tiers, and bosses roll twice. Percentages are the share of drops.</p>'
   +'<div class="tiers-line">Met '+met+'/'+all.length+' &middot; Studied '+studied+'/'+all.length+'</div>';
  DUNGEONS.forEach((D,di)=>{
    const list=D.mobs.map(m=>({name:m[0],role:m[1],boss:false})).concat([{name:D.boss[0],role:D.boss[1],boss:true}]).concat(kn(SECRET[di].name)>0?[{name:SECRET[di].name,role:'reaper',boss:true,secret:true}]:[]);
    const anyStudied=list.some(e=>kn(e.name)>=KNOW_AT);
    h+='<div class="bes-gate"><div class="bes-h"><div class="badge r'+di+'">'+RANKS[di]+'</div><div><h3>'+D.name+'</h3><div class="tiers-line">'+(anyStudied?TIER_W[di].map((w,t)=>w?TIERS[t]+' '+w+'%':'').filter(Boolean).join(' &middot; '):'Tier mix unknown. Study an enemy here to learn it.')+'</div></div></div>';
    list.forEach(e=>{
      const k=kn(e.name), isStudied=k>=KNOW_AT, open=ui.bes===e.name;
      if(k<=0){
        h+='<div class="bes-row locked"><span class="ico unk" aria-hidden="true"><svg viewBox="0 0 64 64">'+IC['?']+'</svg></span><div><div class="u-name">???</div><div class="u-sub">Unknown. Defeat it to add it to the ledger.</div></div><span class="u-tag">Locked</span></div>';
        return;
      }
      const rolls=e.boss?'2 rolls (100% and 60%)':'28% per kill';
      h+='<button class="bes-row" data-a="bes" data-k="'+e.name+'" aria-expanded="'+open+'">'+ico(e.name,di,{boss:e.boss,role:e.role,secret:e.secret})
        +'<div><div class="u-name">'+e.name+'</div><div class="u-sub">'+ROLES[e.role].label+(isArmed(e.name)?' &middot; Gear-bearer':'')+' &middot; '
        +(isStudied?rolls:'Kills '+k+'/'+KNOW_AT+' &middot; drops unknown')+'</div></div><span class="u-tag">'
        +(open?'Hide':(isStudied?'Drops':'Study'))+'</span></button>';
      if(!open) return;
      h+=besExtra(e.boss?'b:'+e.name:e.name, e.boss?GATE_ABIL[di]:null);
      if(isStudied){
        const rows=tableFor(di,e.role,e.boss,false,SIG[e.name]).filter(r=>r.p>0).sort((a,b)=>ITEM[b.id].tier-ITEM[a.id].tier||b.p-a.p);
        h+='<div class="bes-table">'+rows.map(r=>{ const d=ITEM[r.id]; return '<div class="drop t'+d.tier+'"><span class="tn">'+d.name+'</span><span class="u-tag">'+TIERS[d.tier]+' '+SLOTS[d.slot]+'</span><span class="num">'+pc(r.p)+'</span><div class="dbar"><i style="width:'+Math.max(1.5,r.p*100)+'%"></i></div></div>'; }).join('')+'</div>';
      } else {
        h+='<div class="bes-table"><div class="u-sub">Its drops are still a mystery. Defeat '+e.name+' '+(KNOW_AT-k)+' more time'+(KNOW_AT-k===1?'':'s')+' to study it.</div>'
         +'<div class="bar"><i class="fill xp" style="width:'+pct(k,KNOW_AT)+'%"></i></div>'
         +['','',''].map(()=>'<div class="drop"><span class="dim">???</span><span class="u-tag">???</span><span class="num dim">??%</span></div>').join('')+'</div>';
      }
    });
    h+='</div>';
  });
  // Hell Tower
  const twList=TW_MOBS.map(m=>({name:m[0],role:m[1],boss:false})).concat(TW_BOSS.map(n=>({name:n,role:'vanguard',boss:true})));
  h+='<div class="bes-gate"><div class="bes-h"><div class="badge" style="color:#ff8a6a">T</div><div><h3>The Hell Tower</h3><div class="tiers-line">Drops improve with every floor. Studied entries show the tier mix at several heights.</div></div></div>';
  twList.forEach(e=>{
    const k=kn(e.name), isStudied=k>=KNOW_AT, open=ui.bes===e.name;
    if(k<=0){ h+='<div class="bes-row locked"><span class="ico unk" aria-hidden="true"><svg viewBox="0 0 64 64">'+IC['?']+'</svg></span><div><div class="u-name">???</div><div class="u-sub">Unknown. Defeat it to add it to the ledger.</div></div><span class="u-tag">Unseen</span></div>'; return; }
    h+='<button class="bes-row" data-a="bes" data-k="'+e.name+'" aria-expanded="'+open+'">'+ico(e.name,5,{boss:e.boss,role:e.boss?'reaper':e.role})

    if(!open) return;
    h+=besExtra(e.boss?'b:'+e.name:'t:'+e.name, e.boss?GATE_ABIL[TW_BOSS.indexOf(e.name)%GATE_ABIL.length]:null);
    if(isStudied){
      h+='<div class="bes-table">'+[1,25,50,75,100].map(f=>{ const rows=towerTable(f,e.role,e.boss,false), tot=[0,0,0,0,0]; rows.forEach(r=>{ tot[ITEM[r.id].tier]+=r.p; });
        return '<div class="u-sub num">Floor '+f+': '+tot.map((v,t)=>v>=.005?TIERS[t]+' '+Math.round(v*100)+'%':'').filter(Boolean).join(' &middot; ')+'</div>'; }).join('')
        +(e.boss?'<div class="u-sub">Its unique: guaranteed the first time, '+Math.round(TW.repeat*100)+'% after (gold instead while you carry one).</div>':'<div class="u-sub">Elites of this kind lean toward better tiers.</div>')+'</div>';
    } else {
      h+='<div class="bes-table"><div class="u-sub">Its drops are still a mystery. Defeat it '+(KNOW_AT-k)+' more time'+(KNOW_AT-k===1?'':'s')+' to study it.</div><div class="bar"><i class="fill xp" style="width:'+pct(k,KNOW_AT)+'%"></i></div></div>';
    }
  });
  h+='</div>';

function statGain(k){
  const P=S.player, f=()=>({Strike:pAtk(),'Max HP':pMax(),Mana:pMana(),Siphon:pSiph(),Ward:pWard(),Slots:slots()});
  const a=f(); P.stats[k]++; const b=f(); P.stats[k]--;
  const out=Object.keys(a).filter(x=>b[x]!==a[x]).map(x=>x+' +'+(b[x]-a[x]));

  return out.join(', ');
}

  if(k==='rift') return cxP('Opens at level '+RIFT_LV+' once the Throne of Ash has fallen. Each depth is a '+RIFT_ROOMS+'-room run through a random gate\'s dead, at your level plus one per three depths, as strong as the deepest gate and '+pct(RIFT_STEP)+' harder per depth. Gear drops rise '+pct(RIFT_DROP)+' per depth (at most x'+RIFT_DROP_MAX+'). Clearing your deepest depth opens the next and leaves an extra legendary. No curses, no difficulty levels.');

const cxQuery=()=>String(ui.cxq||'').trim().toLowerCase().length>=2?String(ui.cxq).trim().toLowerCase():'';
function cxSearchHTML(){   // every row and paragraph of every page that mentions the search, grouped by page
  const q=cxQuery(), plain=x=>x.replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').toLowerCase(); let n=0, h='';
  for(const [k,name] of CODEX){ const html=codexSection(k); if(!html) continue;
    const bits=(html.match(/<div class="tt-row cx-row">[\s\S]*?<\/div><\/div><\/div>|<p class="help-p">[\s\S]*?<\/p>/g)||[]).filter(b=>plain(b).includes(q));
    if(!bits.length) continue; n+=bits.length;
    h+='<p class="group-h">'+name+' <button class="linkbtn" data-a="cx" data-k="'+k+'">open page</button></p>'+bits.map(b=>b.startsWith('<p')?b:'<div class="items">'+b+'</div>').join(''); }
  return '<p class="q-note">'+(n?n+' match'+(n>1?'es':'')+' for "'+q.replace(/[&<>]/g,'')+'". <button class="linkbtn" data-a="cxclear">Clear</button>':'Nothing in the Codex mentions "'+q.replace(/[&<>]/g,'')+'". <button class="linkbtn" data-a="cxclear">Clear</button>')+'</p>'+h;
}
function codexHTML(){
  const k=CODEX.some(c=>c[0]===ui.cx)?ui.cx:'basics', name=CODEX.find(c=>c[0]===k)[1];
  return '<section class="win" aria-labelledby="h-cx"><h2 class="win-h" id="h-cx">Codex &middot; '+name+'</h2>'
   +'<input id="cxq" class="cx-q" type="search" data-a="cxq" placeholder="Search every page (poison, armor, Lifedrain...)" aria-label="Search the Codex" value="'+String(ui.cxq||'').replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]))+'">'
   +(cxQuery()?cxSearchHTML():'<div class="chips cx-nav" role="tablist">'+CODEX.map(c=>'<button class="btn small'+(c[0]===k?' primary':'')+'" role="tab" data-a="cx" data-k="'+c[0]+'" aria-selected="'+(c[0]===k)+'">'+c[1]+'</button>').join('')+'</div>'
   +codexSection(k))+'</section>';
}

  if(id){ const F=FAITH[id], dv=devotion(), nx=DEVOTION[dv+1];
    return h+'<div class="items"><div class="tt-row on"><div><h4>'+F.name+' <span class="u-tag">devotion '+(dv+1)+'/3</span></h4><div class="u-sub">Gives '+buffTxt(faithBuff(id))+'; costs '+buffTxt(F.debuff)+'.</div>'

function buildHTML(){

     +S.army.filter(x=>canFuse(a,x)).map(m=>{ const c=fuseCost(a,m), conf=ui.confirm==='fu'+m.uid;

  }
  return h+'</section>';

  renameo:k=>{ ui.rename=+k; const m=S.army.find(x=>x.uid===+k); ui.rn=m?m.nick:''; }, renamex:()=>{ ui.rename=null; },
  rename:k=>{ if(renameMinion(+k,ui.rn)) ui.rename=null; },
  reforge:k=>{ const it=findItem(+k), c=it&&reforgeCost(it); ui.msg=reforge(+k)?{mk:1,m:'Reforged '+ITEM[it.id].name+' for '+c+' gold.',c:'ok'}:null; },
  rift:k=>{ startRift(+k); }, gsub:k=>{ ui.gsub=['open','war','rift'].includes(k)?k:'open'; ui.msg=null; },
  rdep:k=>{ const b=riftBest(); ui.rd=clamp((ui.rd||b+1)+(+k||0),1,b+1); },
  rcmd:k=>{ ui.rc=+k; ui.rsq=[]; }, rgate:k=>{ ui.rg=+k; },
  rsq:k=>{ const u=+k; ui.rsq=(ui.rsq||[]).includes(u)?ui.rsq.filter(x=>x!==u):(ui.rsq||[]).concat([u]); },
  raid:()=>{ const cmds=S.army.filter(isCommander), gates=raidGates(); const c=cmds.find(m=>m.uid===ui.rc)||cmds[0]; if(!c||!gates.length) return;
    const di=gates.includes(ui.rg)?ui.rg:gates[gates.length-1], sel=(ui.rsq||[]).filter(u=>S.army.some(m=>m.uid===u&&m!==c)).slice(0,squadMax(c)-1);
    if(sendRaid(c.uid,di,sel)){ ui.msg={mk:1,m:c.nick+' marches on the '+DUNGEONS[di].name+' with '+sel.length+' at its back. They return at dawn.',c:'ok'}; ui.rsq=[]; ui.rc=null; } },
  recall:k=>{ recallRaid(+k); },
  selltier:k=>{ const t=+k; if(ui.confirm!=='st'+t){ ui.confirm='st'+t; return; } ui.confirm=null; const r=sellTier(t); ui.msg=r&&r.n?{mk:1,m:'Sold '+r.n+' '+TIERS[t]+' piece'+(r.n>1?'s':'')+' for '+r.g+' gold.',c:'ok'}:null; },
  salvtier:k=>{ const t=+k; if(ui.confirm!=='sv'+t){ ui.confirm='sv'+t; return; } ui.confirm=null; const r=salvageTier(t); ui.msg=r&&r.n?{mk:1,m:'Salvaged '+r.n+' '+TIERS[t]+' piece'+(r.n>1?'s':'')+' into '+r.d+' bone dust.',c:'ok'}:null; },
  junk:()=>{ if(ui.confirm!=='junk'){ ui.confirm='junk'; return; } ui.confirm=null; const r=sellJunk(); ui.msg=r&&r.n?{mk:1,m:'Sold '+r.n+' piece'+(r.n>1?'s':'')+' of junk for '+r.g+' gold.',c:'ok'}:null; },
  sellitem:k=>{ if(ui.confirm!=='si'+k){ ui.confirm='si'+k; return; } ui.confirm=null; const it=S.inv.find(x=>x.u===+k), nm=it&&ITEM[it.id].name, g=sellItem(+k); ui.msg=g?{mk:1,m:'Sold '+nm+' for '+g+' gold.',c:'ok'}:null; }, skreset:()=>{ if(ui.confirm==='skreset'){ ui.confirm=null; resetSkills(); } else ui.confirm='skreset'; }, claim:()=>claimQuest(), dismiss:()=>{S.notices=[]},
  enter:k=>startRun(+k),
  pick:k=>{ const a=k.split('|'); ui.pick=(ui.pick&&ui.pick.uid===+a[0]&&ui.pick.slot===a[1])?null:{uid:+a[0],slot:a[1]}; },
  give:k=>{ const a=k.split('|'); giveGear(+a[0],+a[1]); ui.pick=null; },
  take:k=>{ const a=k.split('|'); takeGear(+a[0],a[1]); }, settings:()=>{ if(S.mode!=='town') return; ui.tab=ui.tab==='settings'?'gates':'settings'; ui.msg=null; ui.exp=''; },
  slotsave:k=>{ if(slotRead(+k)&&ui.confirm!=='ss'+k){ ui.confirm='ss'+k; return; } ui.confirm=null; ui.msg=slotWrite(+k)?{m:'Saved to slot '+k+'.',c:'ok'}:{m:'Could not write to slot '+k+'. Use a save code instead.',c:'bad'}; },
  slotload:k=>{ if(ui.confirm!=='sl'+k){ ui.confirm='sl'+k; return; } ui.confirm=null; ui.msg=slotLoad(+k)?{m:'Loaded slot '+k+'.',c:'ok'}:{m:'That slot could not be read.',c:'bad'}; ui.exp=''; },
  ult:k=>{ chooseUlt(k); },
  swear:k=>{ if(ui.confirm!=='swear'+k){ ui.confirm='swear'+k; return; } ui.confirm=null; if(swear(k)) notify('You are now the '+FAITH[k].name+'.','ok'); },
  renounce:()=>{ if(ui.confirm!=='renounce'){ ui.confirm='renounce'; return; } ui.confirm=null; if(renounce()) notify('You renounce your oath. The shrine is silent.',''); },
  heat:k=>{ const a=k.split('|'); setHeat(+a[0],+a[1]); },
  bakload:k=>{ if(ui.confirm!=='bl'+k){ ui.confirm='bl'+k; return; } ui.confirm=null; ui.msg=bakLoad(+k)?{m:'Restored the earlier autosave.',c:'ok'}:{m:'That autosave could not be read.',c:'bad'}; ui.exp=''; },
  slotdel:k=>{ if(ui.confirm!=='sd'+k){ ui.confirm='sd'+k; return; } ui.confirm=null; slotDelete(+k); ui.msg={m:'Slot '+k+' deleted.',c:''}; },
  mkcode:()=>{ ui.exp=exportCode(); ui.msg=ui.exp?null:{m:'Could not create a code.',c:'bad'}; },
  copycode:()=>{ const t=document.getElementById('exp'); if(!t) return; const v=t.value;
    const fallback=()=>{ const x=document.getElementById('exp'); let ok=false; if(x){ x.focus(); x.select(); try{ ok=document.execCommand('copy'); }catch(e){} }
      ui.msg=ok?{m:'Code copied.',c:'ok'}:{m:'Copying is blocked here. The code is selected: press Ctrl+C (Cmd+C on a Mac) to copy it.',c:'bad'}; render(); const y=document.getElementById('exp'); if(y&&!ok){ y.focus(); y.select(); } };
    try{ navigator.clipboard.writeText(v).then(()=>{ ui.msg={m:'Code copied.',c:'ok'}; render(); },fallback); }catch(e){ setTimeout(fallback,0); } },
  loadcode:()=>{
    if(ui.confirm!=='lc'){ ui.confirm='lc'; return; } ui.confirm=null;
    if(importCode(ui.imp)){ ui.imp=''; ui.exp=''; ui.msg={m:'Save code loaded.',c:'ok'}; } else ui.msg={m:'That code is not a valid save.',c:'bad'};
  },
  wear:k=>{ wearTitle(k); },
  cxclear:()=>{ ui.cxq=''; },
  cxq:()=>{},   /* the search box: typing is handled by the input listener; data-a only lets focus come back after a render */
  ttf:k=>{ ui.ttf=(k in {all:1,got:1,locked:1,close:1}||/^r[0-5]$/.test(k))?k:'all'; },
  tower:k=>startTower(+k),
  act:k=>act(k),
  target:k=>setTarget(k),
  flee:()=>flee(),
  raise:k=>tryRaise(k), descend:()=>descend(), town:()=>returnTown(), rest:()=>restDay(),
  release:k=>{ if(ui.confirm===+k){ release(+k); ui.confirm=null; } else ui.confirm=+k; },
  newgame:()=>{ if(ui.confirm==='new'){ ui.confirm=null; newGame(); OPEN_HELP.on=false; ui.tab='gates'; ui.gsub='open'; ui.exp=''; ui.msg=null; } else ui.confirm='new'; }
};
const CONFIRM_ACTS=['release','newgame','ngp','ngppick','skreset','sellitem','discard','slotsave','slotload','slotdel','loadcode','junk','loadfile','fuse','sjunk','bakload','swear','renounce','selltier','salvtier'];   // two-press actions: a click on these keeps the pending confirm
document.addEventListener('click',e=>{
  MUSIC.armed=true;
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(ui.confirm!==null && !CONFIRM_ACTS.includes(a)) ui.confirm=null;
  ACTIONS[a]&&ACTIONS[a](b.dataset.k); render();
});
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='cxq'){ ui.cxq=e.target.value.slice(0,40); render(); return; } if(e.target&&e.target.id==='imp') ui.imp=e.target.value; if(e.target&&e.target.id==='rn') ui.rn=e.target.value; });
document.addEventListener('change',e=>{   // a dropdown with data-a works like a button whose data-k is the chosen value
  const sl=e.target&&e.target.tagName==='SELECT'&&e.target.dataset&&e.target.dataset.a; if(sl&&ACTIONS[sl]){ ACTIONS[sl](e.target.value); render(); return; }
  // a save file was picked: read it, then ask before loading
  const f=e.target&&e.target.id==='loadfile'&&e.target.files&&e.target.files[0]; if(!f) return;
  if(f.size>2e6){ ui.msg={m:'That file is too large to be a save.',c:'bad'}; render(); return; }
  const rd=new FileReader(); rd.onload=()=>{ ui.file={name:f.name,text:String(rd.result||'')}; ui.confirm=null; render(); }; rd.readAsText(f);
});
window.addEventListener('storage',e=>{   // another tab of this game saved: stop saving here so neither overwrites the other
  if(e.key===SAVE_KEY&&e.newValue!=null&&!TAB.blocked){ TAB.blocked=true; try{ render(); }catch(x){} } });
window.addEventListener('resize',()=>{ if(VIEW.fx==='auto') try{ applyView(); }catch(e){} });   // Auto effects follow the window size
document.addEventListener('pointerdown',()=>{ if(!MUSIC.armed){ MUSIC.armed=true; music(); } },{once:true});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='rn'){ if(e.key==='Escape'){ e.preventDefault(); ui.rename=null; render(); return; } if(e.key==='Enter'&&ui.rename!=null){ e.preventDefault(); ACTIONS.rename(String(ui.rename)); render(); } return; }   // typing a minion's new name
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const typing=e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='?'&&!typing){ e.preventDefault(); ui.keys=!ui.keys; render(); return; }   // the shortcut sheet
  if(e.key==='Escape'){ let ch=true;   // closes the sheet, then a pending confirm, a rename, a Gates sub-tab, then any other town tab
    if(ui.keys) ui.keys=false; else if(ui.confirm) ui.confirm=null; else if(ui.rename!=null) ui.rename=null;
    else if(S.mode==='town'&&ui.tab==='gates'&&ui.gsub&&ui.gsub!=='open') ui.gsub='open';
    else if(S.mode==='town'&&ui.tab&&ui.tab!=='gates'){ ui.tab='gates'; ui.gsub='open'; } else ch=false;
    if(ch){ e.preventDefault(); ui.msg=null; render(); } return; }
  if(ui.keys) return;
  if(S.mode==='town'&&!typing&&/^[1-9]$/.test(e.key)){ const b=app.querySelectorAll('.tabs>.tab:not(.keyhint)')[+e.key-1];   // town: 1-9 switch tabs
    if(b&&!b.disabled&&b.dataset.k){ e.preventDefault(); ACTIONS.tab(b.dataset.k); render(); } return; }
  if(S.mode==='raise'&&e.target&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){   // between rooms: 1-4 pick a door
    const r=S.run, ds=r&&!r.cleared&&r.doors; const i=/^[1-9]$/.test(e.key)?+e.key-1:-1;
    if(ds&&i>=0&&i<ds.length){ e.preventDefault(); ACTIONS.door(ds[i]); render(); }
    else if(e.key===' '&&r&&r.corpses.some(c=>!c.tried)&&!(e.target&&e.target.tagName==='BUTTON')){ e.preventDefault(); ACTIONS.raisebest(); render(); }   // Space: raise the best
    return; }
  if(S.mode!=='battle') return;
  if(e.key===']'||e.key==='['){ const f=liveFoes(); if(f.length>1){ e.preventDefault(); const i=f.findIndex(x=>x.id===S.run.target); setTarget(f[(i+(e.key==='['?f.length-1:1))%f.length].id); render(); } return; }   // Tab stays with the browser, so keyboard players can still move between buttons
  const ord=ORDER_KEYS[e.key.toLowerCase()]; if(ord){ e.preventDefault(); if(command(ord)) render(); return; }
  let k={'1':'strike','2':'siphon','3':'ward'}[e.key]; if(!k&&e.key.toLowerCase()==='r'&&canUlt()) k='ult';
  if(!k&&/^[4-9]$/.test(e.key)){ const s=activeSkills()[+e.key-4]; if(s) k='sk:'+s.id; }
  if(!k){ const pk=Object.keys(POTIONS).find(x=>POTIONS[x].key.toLowerCase()===e.key.toLowerCase()); if(pk) k='pot:'+pk; }
  if(k){ e.preventDefault(); act(k); render(); }
});

// drifting souls and embers
(function(){
  const cv=document.getElementById('embers'); if(!cv||!cv.getContext) return;
  const cx=cv.getContext('2d'); let W=0,H=0,P=[];
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const d=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0); }
  function mk(init){ return {x:Math.random()*W,y:init?Math.random()*H:H+12,r:rnd(.7,2.2),vy:rnd(.12,.5),dx:rnd(-.12,.12),ph:Math.random()*6.28,soul:Math.random()<.65}; }
  function draw(t){
    cx.clearRect(0,0,W,H); const hell=document.body.classList.contains('hell');
    for(const p of P){
      const a=.25+.35*Math.sin(t/900+p.ph), c=hell?(p.soul?'255,122,60':'255,190,90'):p.soul?'143,212,106':'224,138,60';   // in the Tower every soul burns
      cx.fillStyle='rgba('+c+','+(a*.18)+')'; cx.beginPath(); cx.arc(p.x,p.y,p.r*4,0,6.283); cx.fill();
      cx.fillStyle='rgba('+c+','+a+')'; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
  }
  function step(t){
    if(document.body.classList.contains('calm')){ draw(0); requestAnimationFrame(step); return; }
    const hot=document.body.classList.contains('hell')?2.2:1;
    for(let i=0;i<P.length;i++){ const p=P[i]; p.y-=p.vy*hot; p.x+=p.dx+Math.sin(t/2000+p.ph)*.15; if(p.y<-12) P[i]=mk(false); }
    draw(t); requestAnimationFrame(step);
  }
  size(); const n=W<600?22:44; for(let i=0;i<n;i++) P.push(mk(true));
  window.addEventListener('resize',()=>{ size(); });
  if(still) draw(0); else requestAnimationFrame(step);
})();

applyView(); loadGame(); if(OPEN_HELP.on){ ui.tab='gates'; OPEN_HELP.on=false; } render();
</script>
