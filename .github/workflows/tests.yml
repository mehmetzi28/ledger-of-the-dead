name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Game tests
        run: node tests/run-tests.js
      - name: UI fuzz (random clicks, 12 seeds)
        run: node tests/fuzz.js 12 2500
